name: Build

on:
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Show Go version
        run: go version

      - name: Build Windows agent
        run: go build -ldflags "-H=windowsgui" -o build/mqtt-agent-win.exe ./source/win-os

      - name: Build Windows scenes binary
        run: go build -o build/mqtt-scenes-win.exe ./source/scenes

      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version 5.0.2

      - name: Add dotnet tools to PATH
        run: echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Add WiX UI extension
        run: wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build MSI
        run: wix build source/win-os/installer/Product.wxs -ext WixToolset.UI.wixext -arch x64 -culture de-DE -b build -out build/mqtt-agent-win.msi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mqtt-agent-win
          path: build/mqtt-agent-win.msi
          retention-days: 90

  build-linux:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Sy --noconfirm go

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Go version
        run: go version

      - name: Build Linux agent
        run: GOOS=linux GOARCH=amd64 go build -o build/mqtt-agent-linux ./source/linux-os

      - name: Build Linux scenes binary
        run: GOOS=linux GOARCH=amd64 go build -o build/mqtt-scenes-linux ./source/scenes

      - name: Build Arch package
        run: |
          mkdir -p pkg-build
          cp source/linux-os/PKGBUILD pkg-build/
          cp source/linux-os/workstation-agent.install pkg-build/
          cp source/linux-os/workstation-agent.service pkg-build/
          cp build/mqtt-agent-linux pkg-build/
          cp build/mqtt-scenes-linux pkg-build/
          useradd -m builder
          chown -R builder:builder pkg-build
          cd pkg-build
          su builder -c "makepkg -f --noconfirm --skipinteg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mqtt-agent-linux
          path: pkg-build/*.pkg.tar.zst
          retention-days: 90